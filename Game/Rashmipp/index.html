<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>CODE X</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:#100c18; font-family:Arial,Helvetica,sans-serif; }
    #unity-container, #unity-fullscreen-container { position:fixed; inset:0; width:100vw; height:100vh; overflow:hidden; background:#100c18; }
    #unity-canvas { display:block; position:absolute; inset:0; width:100%; height:100%; border:0; opacity:0; transition:opacity .65s ease; background:transparent; }
    #unity-loading-container { position:fixed; inset:0; z-index:5; display:flex; align-items:center; justify-content:center; overflow:hidden; background:#17111f; color:white; transition:opacity .65s ease; }
    #loading-video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    #loading-shade { position:absolute; inset:0; background:linear-gradient(0deg,rgba(15,8,22,.72),rgba(15,8,22,.05) 70%); }
    #loading-content { position:absolute; left:clamp(24px,8vw,120px); bottom:clamp(32px,9vh,100px); width:min(520px,82vw); text-shadow:0 2px 18px rgba(0,0,0,.65); }
    #loading-title { margin:0 0 10px; font-size:clamp(25px,4vw,42px); letter-spacing:.08em; font-weight:700; }
    #loading-message { margin:0 0 18px; font-size:clamp(14px,1.5vw,18px); color:rgba(255,255,255,.9); }
    #progress-track { width:100%; height:7px; border-radius:8px; background:rgba(255,255,255,.36); overflow:hidden; }
    #progress-fill { width:0%; height:100%; border-radius:8px; background:#ff80ad; transition:width .18s ease; }
    #unity-warning { position:fixed; z-index:10; left:50%; top:12px; transform:translateX(-50%); width:min(760px,94vw); color:#111; }
    #unity-warning>div { margin:6px 0; padding:12px 16px; border-radius:8px; }
    #unity-footer, #unity-loading-bar { display:none !important; }
  </style>
</head>
<body>
  <div id="unity-container">
    <div id="unity-fullscreen-container">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
    </div>
    <div id="unity-loading-container">
      <video id="loading-video" autoplay muted loop playsinline preload="auto"><source src="loading.mp4" type="video/mp4"></video>
      <div id="loading-shade"></div>
      <div id="loading-content">
        <h1 id="loading-title">CODE X</h1>
        <p id="loading-message">Loading your world…</p>
        <div id="progress-track"><div id="progress-fill"></div></div>
      </div>
    </div>
    <div id="unity-warning"></div>
  </div>
  <script>
    const canvas = document.querySelector('#unity-canvas');
    const loading = document.querySelector('#unity-loading-container');
    const progressFill = document.querySelector('#progress-fill');
    const warning = document.querySelector('#unity-warning');
    const video = document.querySelector('#loading-video');
    const reversedWheelEvents = new WeakSet();
    window.addEventListener('wheel', event => {
      if (reversedWheelEvents.has(event)) return;
      if (event.target !== canvas && !canvas.contains(event.target)) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      const reversedEvent = new WheelEvent('wheel', {
        bubbles: true,
        cancelable: true,
        composed: true,
        deltaX: event.deltaX,
        deltaY: -event.deltaY,
        deltaZ: event.deltaZ,
        deltaMode: event.deltaMode,
        clientX: event.clientX,
        clientY: event.clientY,
        screenX: event.screenX,
        screenY: event.screenY,
        ctrlKey: event.ctrlKey,
        shiftKey: event.shiftKey,
        altKey: event.altKey,
        metaKey: event.metaKey
      });
      reversedWheelEvents.add(reversedEvent);
      event.target.dispatchEvent(reversedEvent);
    }, { capture: true, passive: false });
    let unityInstance = null;
    let audioOwner = localStorage.getItem('audio_owner') || 'video';
    function syncGameAudio() {
      const audioContext = unityInstance?.Module?.audioContext;
      if (!audioContext) return;
      if (audioOwner === 'game') audioContext.resume().catch(() => {});
      else audioContext.suspend().catch(() => {});
    }
    window.addEventListener('message', event => {
      if (event.origin !== window.location.origin || event.source !== window.parent) return;
      if (!event.data || event.data.type !== 'GAME_AUDIO_OWNER') return;
      audioOwner = event.data.owner;
      syncGameAudio();
    });
    video.play().catch(() => {});
    function unityShowBanner(msg, type) {
      const item = document.createElement('div');
      item.textContent = msg;
      item.style.background = type === 'error' ? '#ef4444' : '#facc15';
      warning.appendChild(item);
      if (type !== 'error') setTimeout(() => item.remove(), 5000);
    }
    const buildUrl = 'Build';
    const loaderUrl = buildUrl + '/Rashmipp.loader.js';
    const config = {
      dataUrl: buildUrl + '/Rashmipp.data',
      frameworkUrl: buildUrl + '/Rashmipp.framework.js',
      codeUrl: buildUrl + '/Rashmipp.wasm',
      streamingAssetsUrl: 'StreamingAssets',
      fullscreenElementID: 'unity-fullscreen-container',
      companyName: "DefaultCompany",
      productName: "CODE X",
      productVersion: "1.0",
      showBanner: unityShowBanner
    };
    const script = document.createElement('script');
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, progress => {
        progressFill.style.width = `${Math.round(progress * 100)}%`;
      }).then(instance => {
        unityInstance = instance;
        syncGameAudio();
        canvas.style.opacity = '1';
        loading.style.opacity = '0';
        loading.style.pointerEvents = 'none';
        setTimeout(() => loading.remove(), 700);
      }).catch(error => {
        document.querySelector('#loading-message').textContent = 'The game could not start: ' + error;
      });
    };
    script.onerror = () => {
      document.querySelector('#loading-message').textContent = 'The Unity WebGL build is not included in this clone.';
      progressFill.style.display = 'none';
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
